<link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<header>
  <nav class="navbar navbar-expand-lg fixed-top cafe-nav">
    <div class="container-fluid px-4">

      <a class="navbar-brand cafe-brand" routerLink="/">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 38" width="34" height="28" fill="none" aria-hidden="true">
          <path d="M14 9 Q16 5.5 14 2" stroke="#001f1f" stroke-width="1.6" stroke-linecap="round"/>

        data-bs-toggle="collapse"

        aria-controls="navbarMain"
        aria-expanded="false"

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link cafe-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a></li>

          <li class="nav-item"><a class="nav-link cafe-link" routerLink="/kontakt" routerLinkActive="active">Kontakt</a></li>

      </div>

    </div>
  </nav>
